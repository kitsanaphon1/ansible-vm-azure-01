- name: เปิดพอร์ต 80 และ 443 บน Azure NSG ด้วย Azure CLI
  hosts: localhost
  connection: local
  gather_facts: no

  tasks:

    # ====== HTTP ======
    - name: ตรวจว่า rule Allow-HTTP มีอยู่หรือไม่
      shell: |
        az network nsg rule list \
          --resource-group {{ resource_group }} \
          --nsg-name {{ nsg_name }} \
          --query "[?name=='Allow-HTTP']" \
          --output tsv
      register: http_rule
      changed_when: false

    - name: ตรวจว่า priority 1001 ถูกใช้แล้วหรือยัง (สำหรับ HTTP)
      shell: |
        az network nsg rule list \
          --resource-group {{ resource_group }} \
          --nsg-name {{ nsg_name }} \
          --query "[?priority==1001]" \
          --output tsv
      register: http_priority_check
      changed_when: false

    - name: กำหนด priority ให้ HTTP rule อัตโนมัติ
      set_fact:
        http_priority: "{{ '1101' if http_priority_check.stdout != '' else '1001' }}"

    - name: สร้าง rule HTTP ถ้ายังไม่มี
      shell: |
        az network nsg rule create \
          --resource-group {{ resource_group }} \
          --nsg-name {{ nsg_name }} \
          --name Allow-HTTP \
          --priority {{ http_priority }} \
          --access Allow \
          --direction Inbound \
          --protocol Tcp \
          --destination-port-range 80 \
          --source-address-prefix '*' \
          --destination-address-prefix '*'
      when: http_rule.stdout == ""
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ lookup('env','AZURE_SUBSCRIPTION_ID') }}"
        AZURE_CLIENT_ID: "{{ lookup('env','AZURE_CLIENT_ID') }}"
        AZURE_SECRET: "{{ lookup('env','AZURE_SECRET') }}"
        AZURE_TENANT: "{{ lookup('env','AZURE_TENANT') }}"

    # ====== HTTPS ======
    - name: ตรวจว่า rule Allow-HTTPS มีอยู่หรือไม่
      shell: |
        az network nsg rule list \
          --resource-group {{ resource_group }} \
          --nsg-name {{ nsg_name }} \
          --query "[?name=='Allow-HTTPS']" \
          --output tsv
      register: https_rule
      changed_when: false

    - name: ตรวจว่า priority 1002 ถูกใช้แล้วหรือยัง (สำหรับ HTTPS)
      shell: |
        az network nsg rule list \
          --resource-group {{ resource_group }} \
          --nsg-name {{ nsg_name }} \
          --query "[?priority==1002]" \
          --output tsv
      register: https_priority_check
      changed_when: false

    - name: กำหนด priority ให้ HTTPS rule อัตโนมัติ
      set_fact:
        https_priority: "{{ '1102' if https_priority_check.stdout != '' else '1002' }}"

    - name: สร้าง rule HTTPS ถ้ายังไม่มี
      shell: |
        az network nsg rule create \
          --resource-group {{ resource_group }} \
          --nsg-name {{ nsg_name }} \
          --name Allow-HTTPS \
          --priority {{ https_priority }} \
          --access Allow \
          --direction Inbound \
          --protocol Tcp \
          --destination-port-range 443 \
          --source-address-prefix '*' \
          --destination-address-prefix '*'
      when: https_rule.stdout == ""
      environment:
        AZURE_SUBSCRIPTION_ID: "{{ lookup('env','AZURE_SUBSCRIPTION_ID') }}"
        AZURE_CLIENT_ID: "{{ lookup('env','AZURE_CLIENT_ID') }}"
        AZURE_SECRET: "{{ lookup('env','AZURE_SECRET') }}"
        AZURE_TENANT: "{{ lookup('env','AZURE_TENANT') }}"
