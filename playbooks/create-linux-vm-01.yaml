- name: "Create second Ubuntu 20.04 LTS VM in Southeast Asia"
  hosts: localhost
  connection: local
  vars:
    location: southeastasia
    resource_group: rgUbuntuSoutheastAsia
    vm_name: vmUbuntuSEA2
    admin_username: azureuser
    ssh_public_key: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
  tasks:

    - name: "Ensure virtual network exists (shared)"
      azure_rm_virtualnetwork:
        name: vnetUbuntuSEA
        resource_group: "{{ resource_group }}"
        address_prefixes: "10.1.0.0/16"
        location: "{{ location }}"
        state: present

    - name: "Create new subnet (optional: change name to avoid conflict)"
      azure_rm_subnet:
        name: subnetUbuntuSEA2
        resource_group: "{{ resource_group }}"
        virtual_network: vnetUbuntuSEA
        address_prefix: "10.1.2.0/24"
        state: present

    - name: "Create new public IP"
      azure_rm_publicipaddress:
        name: pipUbuntuSEA2
        resource_group: "{{ resource_group }}"
        allocation_method: Static
        state: present

    - name: "Create new NIC"
      azure_rm_networkinterface:
        name: nicUbuntuSEA2
        resource_group: "{{ resource_group }}"
        virtual_network: vnetUbuntuSEA
        subnet: subnetUbuntuSEA2
        public_ip_name: pipUbuntuSEA2
        state: present

    - name: "Create new VM (Ubuntu 20.04)"
      azure_rm_virtualmachine:
        name: "{{ vm_name }}"
        resource_group: "{{ resource_group }}"
        location: "{{ location }}"
        vm_size: Standard_B1s
        admin_username: "{{ admin_username }}"
        ssh_password_enabled: false
        managed_disk_type: Standard_LRS
        ssh_public_keys:
          - path: /home/{{ admin_username }}/.ssh/authorized_keys
            key_data: "{{ ssh_public_key }}"
        network_interfaces: nicUbuntuSEA2
        image:
          offer: 0001-com-ubuntu-server-focal
          publisher: Canonical
          sku: 20_04-lts
          version: latest
        state: present
