- name: Install and Verify Docker on VM
  hosts: all
  become: true
  gather_facts: no

  tasks:

    - name: Wait for SSH connection (max 5 minutes)
      wait_for_connection:
        timeout: 300

    - name: Install Docker (always run)
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
        usermod -aG docker azureuser
      args:
        executable: /bin/bash

    - name: Re-check Docker version after install
      command: docker --version
      register: docker_check_after
      changed_when: false
      failed_when: false  # ป้องกัน playbook ล้มทันที ถ้าติดตั้งไม่สมบูรณ์

    - name: Show Docker version after install
      debug:
        var: docker_check_after.stdout

    - name: Fail if Docker still not installed
      fail:
        msg: "❌ Docker installation failed. Please check manually."
      when: docker_check_after.rc != 0
