- name: Ensure Docker is installed on VM
  hosts: all
  become: true
  gather_facts: no

  tasks:

    - name: Wait for SSH connection (max 5 minutes)
      wait_for_connection:
        timeout: 300

    - name: Check Docker version
      command: docker --version
      register: docker_result
      ignore_errors: true
      failed_when: false  # ✅ ป้องกัน task ล้มเมื่อไม่พบ docker

    - name: Show Docker version (if available)
      debug:
        var: docker_result.stdout
      when: docker_result.rc == 0

    - name: Install Docker if not present
      shell: |
        curl -fsSL https://get.docker.com -o get-docker.sh
        sh get-docker.sh
        usermod -aG docker azureuser
      when: docker_result.rc != 0
      args:
        executable: /bin/bash

    - name: Re-check Docker version after install
      command: docker --version
      register: docker_check_after
      changed_when: false

    - name: Show Docker version after install
      debug:
        var: docker_check_after.stdout

    - name: Fail if Docker still not installed
      fail:
        msg: "❌ Docker installation failed. Please check manually."
      when: docker_check_after.rc != 0
