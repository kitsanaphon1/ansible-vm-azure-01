- name: "Create Ubuntu 20.04 VM with Docker (fixed public IP)"
  hosts: localhost
  connection: local
  collections:
    - azure.azcollection

  tasks:

    - name: "Ensure virtual network exists (shared)"
      azure_rm_virtualnetwork:
        name: vnetDockerDemo
        resource_group: rgUbuntuSoutheastAsia
        address_prefixes: "10.10.0.0/16"
        location: southeastasia
        state: present

    - name: "Create new subnet"
      azure_rm_subnet:
        name: subnetDockerDemo01
        resource_group: rgUbuntuSoutheastAsia
        virtual_network: vnetDockerDemo
        address_prefix: "10.10.1.0/24"
        state: present

    - name: "Create new public IP (Static)"
      azure_rm_publicipaddress:
        name: pipDockerDemo01
        resource_group: rgUbuntuSoutheastAsia
        allocation_method: Static
        state: present

    - name: "Create Network Security Group"
      azure_rm_networksecuritygroup:
        name: nsgDockerDemo01
        resource_group: rgUbuntuSoutheastAsia
        location: southeastasia
        state: present

    - name: "Allow HTTP (port 80) from Internet"
      azure_rm_securityrule:
        name: AllowHTTP
        resource_group: rgUbuntuSoutheastAsia
        security_group_name: nsgDockerDemo01
        access: Allow
        direction: Inbound
        protocol: Tcp
        priority: 1001
        source_address_prefix: "*"
        source_port_range: "*"
        destination_address_prefix: "*"
        destination_port_range: "80"

    - name: "Create new NIC (with NSG)"
      azure_rm_networkinterface:
        name: nicDockerDemo01
        resource_group: rgUbuntuSoutheastAsia
        virtual_network: vnetDockerDemo
        subnet: subnetDockerDemo01
        public_ip_name: pipDockerDemo01
        network_security_group: nsgDockerDemo01
        state: present

    - name: "Create new VM with Docker installed"
      azure_rm_virtualmachine:
        name: vmDockerDemo01
        resource_group: rgUbuntuSoutheastAsia
        location: southeastasia
        vm_size: Standard_B1s
        admin_username: azureuser
        ssh_password_enabled: false
        managed_disk_type: Standard_LRS
        ssh_public_keys:
          - path: /home/azureuser/.ssh/authorized_keys
            key_data: "{{ lookup('file', '~/.ssh/id_rsa.pub') }}"
        network_interfaces: nicDockerDemo01
        image:
          offer: 0001-com-ubuntu-server-focal
          publisher: Canonical
          sku: 20_04-lts
          version: latest
        custom_data: |
          #!/bin/bash
          apt-get update -y
          apt-get install -y curl
          curl -fsSL https://get.docker.com -o get-docker.sh
          sh get-docker.sh
          usermod -aG docker azureuser
        state: present
